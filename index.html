<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keroro Studio</title>
  <meta name="description" content="Keroro Studio 的小工具集合。">
  <style>
    :root {
      --bg: #10100f;
      --card: #f4efe4;
      --ink: #191817;
      --muted: #6a6258;
      --accent: #d36a3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans SC", sans-serif;
      color: var(--card);
      background:
        radial-gradient(circle at 15% 15%, rgba(211, 106, 61, 0.35), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(84, 129, 119, 0.28), transparent 32%),
        var(--bg);
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0;
    }

    .hero {
      display: grid;
      gap: 18px;
      margin-bottom: 36px;
    }

    .eyebrow {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(42px, 8vw, 88px);
      line-height: 0.95;
    }

    .lead {
      max-width: 680px;
      margin: 0;
      color: rgba(244, 239, 228, 0.76);
      font-size: 18px;
      line-height: 1.8;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .app-card {
      display: grid;
      gap: 16px;
      min-height: 260px;
      padding: 24px;
      border-radius: 28px;
      color: var(--ink);
      background: var(--card);
      text-decoration: none;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 34px 92px rgba(0, 0, 0, 0.36);
    }

    .app-card h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.05;
    }

    .app-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-self: end;
    }

    .tag {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(211, 106, 61, 0.14);
      color: #8b3a20;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">Keroro Studio</p>
      <h1>一个放小工具和实验项目的地方。</h1>
      <p class="lead">以后你的网页工具、AI 小助手、数据看板都可以放在这里。现在第一个应用是男士穿搭教练。</p>
    </section>

    <section class="apps" aria-label="应用列表">
      <a class="app-card" href="./apps/mens-style-coach/">
        <div>
          <h2>男士穿搭教练</h2>
          <p>根据场景、体型、肤色、预算和风格偏好，生成能直接照着穿的男士穿搭建议。</p>
        </div>
        <div class="tag-row">
          <span class="tag">穿搭</span>
          <span class="tag">男士</span>
          <span class="tag">离线可用</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
